name: Dependabot Auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Dependabotが作成したPRのみ対象
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Auto-approve and merge
        # パッチとマイナーバージョン更新、または間接的依存関係（indirect）のみ自動マージ
        # 間接的依存関係の場合、update-typeがnullになることがあるため、dependency-typeでチェック
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.dependency-type == 'indirect'
        run: |
          current_head=$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')
          if [ "$current_head" != "$PR_HEAD_SHA" ]; then
            echo "PR has changed since CI started; skipping merge."
            exit 0
          fi
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major version update
        # メジャーバージョン更新には手動レビューを促すコメント
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ This is a major version update and requires manual review."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
